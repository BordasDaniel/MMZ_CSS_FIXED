<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMZ - Profil</title>
  <link rel="stylesheet" href="../sources/css/general.css">
  <link rel="stylesheet" href="../sources/css/navbar.css">
  <link rel="stylesheet" href="../sources/css/profile.css">
  <link rel="stylesheet" href="../sources/css/footer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">
  <style>
    /* Profilkép feltöltés */
    .profile-avatar-upload {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }

    .profile-avatar-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #00ffff;
      box-shadow: 0 0 25px #00ffff;
    }

    .profile-avatar-overlay {
      position: absolute;
      bottom: 0;
      background: rgba(0, 255, 255, 0.8);
      width: 100%;
      text-align: center;
      padding: 10px 0;
      border-radius: 0 0 50% 50%;
      opacity: 0;
      transition: opacity 0.3s;
      font-weight: bold;
      color: black;
    }

    .profile-avatar-upload:hover .profile-avatar-overlay {
      opacity: 1;
    }

    /* Header profil kép */
    .header-profile-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #00ffff;
      box-shadow: 0 0 15px #00ffff;
    }

    /* Profil sáv */
    .profile-header-bar {
      background: rgba(0, 255, 255, 0.05);
      border-bottom: 1px solid rgba(0, 255, 255, 0.3);
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 255, 255, 0.15);
      margin: 50px auto;
      border-radius: 20px;
      max-width: 800px;
    }

    .profile-header-name {
      font-size: 2.8em;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 20px #00ffff;
      margin: 20px 0;
    }

    .profile-header-details {
      font-size: 1.4em;
      color: #ccc;
      line-height: 2;
    }

    .profile-header-details strong {
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      min-width: 120px;
      display: inline-block;
    }

    /* Header jobb oldal – szép arányos elrendezés */
    .user-profile {
      display: flex;
      align-items: center;
    }

    .profile-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 12px;
      transition: background 0.3s;
    }

    .profile-btn:hover {
      background: rgba(0, 255, 255, 0.1);
    }

    .user-name {
      color: white;
      font-weight: bold;
      font-size: 1em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    @media (max-width: 768px) {
      .user-name {
        display: none;
      }
    }

    .profile-name-container {
  text-align: center;
  margin: 20px 0;
}

.profile-header-name {
  font-size: 2.8em;
  font-weight: bold;
  color: white;
  text-shadow: 0 0 20px #00ffff;
  margin: 0 0 10px 0;
  display: inline-block;
}

.artist-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 1.4em;
  color: #aaa;
}

.artist-label {
  font-size: 0.8em; /* kisebb betűtípus az "Artist"-hoz */
  color: #ccc;
}

.verified-check {
  color: #00ffff;
  font-size: 1.2em;
  text-shadow: 0 0 15px #00ffff;
  font-weight: bold;
}
  </style>
</head>
<body>

  <header>
    <div class="logo">MMZ</div>

    <div class="header-center">
      <div class="search-bar">
        <span class="search-icon"></span>
        <input type="text" placeholder="Keresés...">
      </div>
    </div>

    <div class="header-right">
      <div id="auth-links" class="auth-links">
        <a href="login.html" class="login-btn">Bejelentkezés</a>
        <span class="divider">|</span>
        <a href="register.html" class="login-btn">Regisztráció</a>
      </div>

      <div id="user-profile" class="user-profile" style="display: none;">
        <button id="profileBtn" class="profile-btn">
          <img id="headerProfileImg" class="header-profile-img" src="" alt="Profilkép">
          <span id="userNameDisplay" class="user-name"></span>
        </button>

        <div id="profileDropdown" class="profile-dropdown">
          <a href="profile.html">Profil</a>
          <div id="dropdownUploadLink" style="display: none;">
            <a href="album_upload.html">Album feltöltés</a>
          </div>
          <hr>
          <button id="logoutBtn">Kijelentkezés</button>
        </div>
      </div>
    </div>
  </header>

  <div class="wrapper">
    <nav>
      <ul>
    <li><a href="../index.html">Kezdőlap</a></li>
    <li><a href="music.html">Zenék</a></li>
    <li><a href="policy.html">ÁSZF</a></li>
    <li><a href="promo.html">Promóció</a></li> 
    <li><a href="prods.html">Előadók</a></li>
    <li><a href="contact.html">Kapcsolat</a></li>
    <li><a href="aboutus.html">Rólunk</a></li> <!-- Áthelyezve ide a Kapcsolat alá -->

    <!-- Bejelentkezett felhasználóknak -->
    <div id="authenticatedMenuItems" style="display: none;">
      <li><a href="album_upload.html">ALBUM FELTÖLTÉS</a></li>
      <li><a href="albums_list.html">Albumok listája</a></li>
    </div>
  </ul>
    </nav>

    <main>
      <div class="page-container">
        <h1 class="neon-title">PROFIL</h1>

        <!-- Profil sáv módosítása a profile.html-ben (cseréld ki a .profile-header-bar belső részét) -->

<div class="profile-header-bar">
  <label class="profile-avatar-upload">
    <input type="file" id="profilePicInput" accept="image/*" hidden>
    <img id="profileAvatar" class="profile-avatar-img" src="" alt="Profilkép">
    <div class="profile-avatar-overlay">📸 Kép csere</div>
  </label>

  <div class="profile-name-container">
    <h2 class="profile-header-name" id="fullName">Kiss Tibor</h2>
    <div class="artist-badge">
      <span class="artist-label">Artist</span>
      <span class="verified-check">✔</span>
    </div>
  </div>

  <div class="profile-header-details">
    <p><strong>E-mail:</strong> <span id="emailDisplay">-</span></p>
    <p><strong>Telefonszám:</strong> <span id="phoneDisplay">-</span></p>
  </div>
</div>

        <div class="profile-actions" style="text-align: center; margin-top: 40px;">
          <a href="album_upload.html" class="primary-btn">Album feltöltés indítása</a>
        </div>
      </div>
    </main>
  </div>

  <div class="about-us">
    <a href="aboutus.html">Rólunk</a>
  </div>

  <script>
    const DEFAULT_AVATAR = "https://www.shutterstock.com/image-illustration/neon-glowing-user-icon-profile-260nw-2462175375.jpg";

    function loadProfile() {
      const userJSON = localStorage.getItem('loggedInUser');
      if (!userJSON) {
        window.location.href = 'login.html';
        return;
      }

      let user = JSON.parse(userJSON);

      const fullName = `${user.firstName || ''} ${user.lastName || ''}`.trim() || user.email;
      const shortName = fullName.length > 18 ? fullName.split(' ')[0] : fullName;

      document.getElementById('fullName').textContent = fullName;
      document.getElementById('emailDisplay').textContent = user.email || '-';
      document.getElementById('phoneDisplay').textContent = user.phone || '-';
      document.getElementById('userNameDisplay').textContent = shortName;

      const profilePic = user.profilePic || DEFAULT_AVATAR;
      document.getElementById('profileAvatar').src = profilePic;
      document.getElementById('headerProfileImg').src = profilePic;
    }

    function updateAuthenticatedMenu() {
      const userJSON = localStorage.getItem('loggedInUser');
      const authMenu = document.getElementById('authenticatedMenuItems');
      const dropdownLink = document.getElementById('dropdownUploadLink');

      if (authMenu) authMenu.style.display = userJSON ? 'block' : 'none';
      if (dropdownLink) dropdownLink.style.display = userJSON ? 'block' : 'none';
    }

    // Profilkép csere
    document.getElementById('profilePicInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const base64 = event.target.result;

        let user = JSON.parse(localStorage.getItem('loggedInUser'));
        user.profilePic = base64;
        localStorage.setItem('loggedInUser', JSON.stringify(user));

        document.getElementById('profileAvatar').src = base64;
        document.getElementById('headerProfileImg').src = base64;

        alert('Profilkép sikeresen frissítve!');
      };
      reader.readAsDataURL(file);
    });

    // Oldal betöltésekor minden frissítése
    window.addEventListener('load', () => {
      const userJSON = localStorage.getItem('loggedInUser');
      const authLinks = document.getElementById('auth-links');
      const userProfile = document.getElementById('user-profile');

      if (userJSON) {
        if (authLinks) authLinks.style.display = 'none';
        if (userProfile) userProfile.style.display = 'flex';

        loadProfile();
        updateAuthenticatedMenu();

        // Dropdown logika
        const profileBtn = document.getElementById('profileBtn');
        const dropdown = document.getElementById('profileDropdown');

        if (profileBtn) {
          profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('active');
          });
        }

        document.addEventListener('click', () => {
          dropdown.classList.remove('active');
        });

        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('loggedInUser');
            alert('Sikeres kijelentkezés!');
            window.location.href = 'base.html';
          });
        }
      } else {
        if (authLinks) authLinks.style.display = 'flex';
        if (userProfile) userProfile.style.display = 'none';
        window.location.href = 'login.html';
      }
    });
  </script>

</body>
</html>
