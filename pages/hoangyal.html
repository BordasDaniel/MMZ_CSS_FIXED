<script>
// Bejelentkezett állapot alapján mutatja/elrejti az albumos menüpontokat
function updateAuthenticatedMenu() {
  const user = localStorage.getItem('loggedInUser');
  const authMenu = document.getElementById('authenticatedMenuItems');

  if (user && authMenu) {
    authMenu.style.display = 'block';
  } else if (authMenu) {
    authMenu.style.display = 'none';
  }
}

// Oldal betöltésekor ellenőrizzük
window.addEventListener('load', updateAuthenticatedMenu);
</script>
